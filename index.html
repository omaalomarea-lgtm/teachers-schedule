<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعلام جدول المعلم - ابتدائية العمرية الأهلية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        @media print {
            .no-print { display: none !important; }
            .print-area { width: 100% !important; box-shadow: none !important; border: none !important; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center p-4">

    <!-- شريط الرأس -->
    <header class="w-full max-w-4xl bg-gradient-to-r from-emerald-800 to-teal-900 text-white rounded-2xl p-6 shadow-lg mb-6 text-center">
        <h1 class="text-2xl md:text-3xl font-extrabold">ابتدائية العمرية الأهلية</h1>
        <p class="text-teal-200 text-sm mt-1">بوابة الاستعلام السريع عن جدول المعلم • الفصل الدراسي الأول 1448هـ</p>
    </header>

    <main class="w-full max-w-4xl flex flex-col items-center">
        <!-- بطاقة الإدخال والبحث -->
        <div class="no-print bg-white p-6 rounded-2xl shadow-md border border-slate-200 w-full max-w-lg mb-6">
            <label for="teacherNum" class="block text-sm font-bold text-slate-700 mb-2 text-center">
                أدخل رقم المعلم (من 1 إلى 26):
            </label>
            <div class="flex gap-2">
                <input type="number" id="teacherNum" min="1" max="26" placeholder="رقم المعلم" 
                    class="w-full px-4 py-3 border-2 border-slate-200 rounded-xl focus:outline-none focus:border-teal-600 font-bold text-lg text-center transition">
                <button onclick="displaySchedule()" class="bg-teal-700 hover:bg-teal-800 text-white font-bold px-6 py-3 rounded-xl transition shadow-md whitespace-nowrap active:scale-95">
                    عرض الجدول
                </button>
            </div>
            
            <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                <span>أو اختر اسم المعلم:</span>
                <select id="teacherSelect" onchange="selectTeacherName(this.value)" class="bg-slate-50 border border-slate-300 rounded-lg p-1.5 text-xs text-slate-700 focus:outline-none max-w-[200px] truncate">
                    <option value="">-- اختر الاسم --</option>
                </select>
            </div>
        </div>

        <!-- رسالة الخطأ -->
        <div id="errorBox" class="hidden bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-xl text-center mb-6 font-semibold text-sm w-full max-w-lg">
            الرجاء إدخال رقم صحيح بين 1 و 26.
        </div>

        <!-- بطاقة عرض صورة الجدول -->
        <div id="resultCard" class="hidden print-area bg-white p-4 md:p-6 rounded-2xl shadow-lg border border-slate-200 w-full flex flex-col items-center">
            <div class="w-full flex justify-between items-center pb-4 border-b border-slate-100 mb-4">
                <div>
                    <span id="labelNum" class="bg-teal-700 text-white text-xs font-bold px-3 py-1 rounded-full"></span>
                    <h2 id="labelName" class="text-xl font-bold text-slate-800 mt-1"></h2>
                </div>
                <div class="flex gap-2 no-print">
                    <a id="downloadBtn" href="#" download class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1">
                        📥 تحميل الصورة
                    </a>
                    <button onclick="window.print()" class="bg-teal-700 hover:bg-teal-800 text-white px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1">
                        🖨️ طباعة
                    </button>
                </div>
            </div>

            <!-- مكان ظهور صورة الجدول الأصلية -->
            <div class="w-full flex justify-center bg-slate-50 p-2 rounded-xl border border-slate-100 overflow-hidden">
                <img id="scheduleImage" src="" alt="جدول المعلم" class="max-w-full h-auto rounded-lg shadow-sm">
            </div>
        </div>
    </main>

    <script>
        const teachersList = {
            1: "اسماعيل جودات حسن عليان",
            2: "السيد عبدالكريم إبراهيم سيدأحمد",
            3: "نزار الخضير",
            4: "حسن عبدالموجود",
            5: "علوان صالح أحمد علي",
            6: "جلال محمد حسين قوقزه",
            7: "عبدالحميد أنور",
            8: "أشرف عفيفي",
            9: "محمود حسن صميدة خميس",
            10: "محمد فوزي ياسين شبار",
            11: "عبدالله محمد شيخ أحمد",
            12: "أحمد حمدي محمد السمان",
            13: "أحمد عبدالرازق عبدالسلام هيلم",
            14: "عبدالحكيم",
            15: "ماهر محمود عبدالله بريص",
            16: "عرفة عبداللطيف عبدالشافي غازي",
            17: "احمد سعيد السيد المزين",
            18: "إدريس",
            19: "أسامه ابراهيم محمد أبوليله",
            20: "عبدالله متعب عبدالله الصالح",
            21: "صهيب عبدالرزاق محمد الموسى",
            22: "عمر بشير مسباح الراشد",
            23: "فواز محمد ابراهيم العقيل",
            24: "اسامة محمد السيد الدسوقي",
            25: "هشام بدر ابراهيم سالم",
            26: "محمد محمد السماني"
        };

        // تعبئة القائمة المنسدلة
        const select = document.getElementById('teacherSelect');
        for (const [num, name] of Object.entries(teachersList)) {
            let opt = document.createElement('option');
            opt.value = num;
            opt.textContent = `${num} - ${name}`;
            select.appendChild(opt);
        }

        function selectTeacherName(val) {
            if(!val) return;
            document.getElementById('teacherNum').value = val;
            displaySchedule();
        }

        function displaySchedule() {
            const num = document.getElementById('teacherNum').value.trim();
            const errorBox = document.getElementById('errorBox');
            const resultCard = document.getElementById('resultCard');
            const scheduleImage = document.getElementById('scheduleImage');
            const downloadBtn = document.getElementById('downloadBtn');

            if (num >= 1 && num <= 26 && teachersList[num]) {
                errorBox.classList.add('hidden');
                document.getElementById('labelNum').textContent = `معلم رقم #${num}`;
                document.getElementById('labelName').textContent = teachersList[num];
                
                // مسار الصورة في مجلد images بنفس رقم الكود
                const imagePath = `images/${num}.jpg`;
                scheduleImage.src = imagePath;
                downloadBtn.href = imagePath;
                
                resultCard.classList.remove('hidden');
                resultCard.scrollIntoView({ behavior: 'smooth' });
            } else {
                resultCard.classList.add('hidden');
                errorBox.classList.remove('hidden');
            }
        }

        document.getElementById('teacherNum').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') displaySchedule();
        });
    </script>
</body>
</html>
